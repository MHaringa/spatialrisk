url: https://mharinga.github.io/spatialrisk/

template:
  bootstrap: 5
  bslib:
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Google Sans Code"}

navbar:
  structure:
    left:  [home, articles, reference, news]
    right: [github]

articles:
  - title: Articles
    contents:
      - fixed-radius-concentration
      - visualisation

reference:
  - title: "Reference"
    desc: >
      `spatialrisk` is organised around fixed-radius aggregation, hotspot
      detection, polygon-based spatial reporting, and supporting spatial data.
      Most users can start with the core functions below, while lower-level
      workflow functions are available for more advanced use.
  - title: "Core functions"
    desc: >
      Main entry points for common fixed-radius concentration and reporting workflows.
    contents:
      - concentration_hotspot
      - radius_sum
      - points_within_radius
      - summarise_points_by_polygon
  - title: "Fixed-radius aggregation"
    desc: >
      Evaluate point-level values and observations within a fixed radius.
    contents:
      - points_within_radius
      - radius_sum
  - title: "Concentration and hotspot detection"
    desc: >
      Find maximum fixed-radius concentrations and inspect the search workflow.
  - subtitle: "Main API"
    contents:
      - concentration_hotspot
  - subtitle: "Advanced hotspot workflow"
    desc: >
      Lower-level functions underlying `concentration_hotspot()` for inspecting
      or running the search steps separately.
    contents:
      - prepare_spatialrisk
      - select_candidates
      - optimize_hotspot
      - plot.hotspot
  - title: "Polygon summaries and visualisation"
    desc: >
      Aggregate point exposures to reporting polygons and visualise spatial values.
    contents:
      - summarise_points_by_polygon
      - choropleth
      - map_points
  - title: "Data"
    desc: >
      Example portfolios, administrative boundaries, and weather data used in
      package examples and workflows.
  - subtitle: "Example datasets"
    contents:
      - Groningen
      - insurance
  - subtitle: "Administrative and spatial boundaries"
    contents:
      - nl_gemeente
      - nl_provincie
      - nl_corop
      - nl_postcode2
      - nl_postcode3
      - nl_postcode4
  - subtitle: "Weather datasets"
    contents:
      - knmi_historic_data
      - knmi_stations
  - title: "Spatial utilities"
    desc: >
      General coordinate conversion, distance, and simple spatial display helpers.
    contents:
      - haversine
      - convert_crs_df
  - title: "Deprecated"
    desc: >
      Deprecated functions retained for backward compatibility.
    contents:
      - concentration
      - points_in_circle
      - find_highest_concentration
      - highest_concentration
      - neighborhood_gh_search
      - plot_points
      - points_to_polygon
      - choropleth_ggplot2
      - interpolate_spline
      - plot.conc
      - plot.neighborhood
